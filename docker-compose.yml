services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskdesk
      POSTGRES_PASSWORD: taskdesk
      POSTGRES_DB: taskdesk
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskdesk"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://taskdesk:taskdesk@db:5432/taskdesk
      SECRET_KEY: dev-only-change-me
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
